<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bearings - fleet board</title>
<style>
__FM_DECISION_CARD_CSS__
</style>
<style>
/* ============================================================
   Board chrome (bb-*) - built on the same tokens/resets/primitives and the
   shared decision-card contract injected above
   (.agents/skills/bearings/assets/decision-card.css).
   ============================================================ */
:root { --container-app: 1180px; }

.bb-nav {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--paper-100) 86%, transparent);
  backdrop-filter: saturate(150%) blur(10px);
  border-bottom: 1px solid var(--border-default);
}
.bb-nav__inner {
  max-width: var(--container-app); margin: 0 auto; padding: 0 28px; height: 64px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.bb-brand { display: inline-flex; align-items: center; gap: 12px; }
.bb-brand__disc {
  display: grid; place-items: center; width: 34px; height: 34px; flex: none;
  border-radius: 999px; background: var(--rust-500); color: var(--paper-000);
  border: 2px solid var(--ink-900); box-shadow: var(--shadow-hard-sm);
}
.bb-brand__disc svg { width: 60%; height: 60%; }
.bb-brand__wm { font-family: var(--font-display); font-size: 23px; color: var(--text-strong); line-height: 1; }
.bb-meta-mono { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-faint); white-space: nowrap; }

.bb-main {
  max-width: var(--container-app); margin: 0 auto;
  padding: 26px 28px 72px; display: flex; flex-direction: column; gap: 22px;
}

/* stat strip */
.bb-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.bb-stat {
  display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; min-width: 0;
  background: var(--surface-card-warm); border: 1px solid var(--border-soft); border-radius: var(--radius-md);
}
.bb-stat--call { background: var(--rust-050); border: 2px solid var(--rust-500); }
.bb-stat__num { font-family: var(--font-mono); font-size: var(--fs-h3); font-weight: 600; line-height: 1; color: var(--text-strong); }
.bb-stat--call .bb-stat__num { color: var(--rust-600); }
.bb-stat__label { font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }

.bb-section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.bb-section__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.bb-cols { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 22px; }

/* ---- Captain's Call: one card at a time, dealt off a visible stack ---- */
.bb-callwrap { display: flex; flex-direction: column; gap: 12px; }
/* extra top margin clears the pile edges that poke below the active card */
.bb-stacknav { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.bb-stacknav__count { flex: 1 1 auto; font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-muted); }
.bb-stacknav__btn {
  display: inline-grid; place-items: center; width: 34px; height: 34px; cursor: pointer;
  background: var(--surface-card); color: var(--text-strong);
  border: 1.5px solid var(--border-default); border-radius: var(--radius-sm);
  transition: background 120ms, border-color 120ms;
}
.bb-stacknav__btn:hover { background: var(--paper-100); border-color: var(--ink-500); }
.bb-stacknav__btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.bb-stacknav__btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.bb-stacknav__btn svg { width: 16px; height: 16px; }
/* the stack: a squared-up paper pile - solid card faces at slight opposing
   rotations, like dealt cards, not translucent offset rectangles. The pile
   thins as cards are answered: two edges, then one, then none on the last. */
.bb-call { position: relative; display: grid; }
.bb-call::before, .bb-call::after {
  content: ""; position: absolute; inset: 0; z-index: 0;
  background: var(--surface-card); border: 2px solid var(--ink-900);
  border-radius: var(--radius-md); box-shadow: var(--shadow-hard-sm);
}
.bb-call::before { transform: rotate(1.3deg) translate(4px, 5px); }
.bb-call::after  { transform: rotate(-1.1deg) translate(-3px, 9px); }
.bb-call--penult::after { display: none; }
.bb-call--last::before, .bb-call--last::after,
.bb-call--empty::before, .bb-call--empty::after { display: none; }
.bb-call > .bb-decision { grid-area: 1 / 1; z-index: 1; }
.bb-call > .bb-decision[hidden] { display: none; }

/* ---- compact rows (Underway / Landed / Charted) ---- */
.bb-rows { display: flex; flex-direction: column; }
.bb-row {
  display: flex; align-items: center; gap: 12px; padding: 11px 18px;
  border-top: 1px solid var(--border-soft); min-width: 0;
}
.bb-row:first-child { border-top: none; }
.bb-row__main { min-width: 0; flex: 1 1 auto; }
.bb-row__title { font-size: var(--fs-sm); font-weight: 700; color: var(--text-strong); line-height: 1.3;
  overflow-wrap: break-word; white-space: normal; }
.bb-row__sub { font-size: var(--fs-xs); color: var(--text-muted); line-height: 1.3; margin-top: 1px;
  overflow-wrap: break-word; white-space: normal; }
.bb-row__id { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-faint); white-space: nowrap; }
.bb-row__pr { font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 600; color: var(--ocean-600); white-space: nowrap; }
.bb-row__pr:hover { text-decoration: underline; }
.bb-row__check { width: 26px; height: 26px; border-radius: var(--radius-sm); display: grid; place-items: center; flex: none;
  background: var(--status-online-soft); color: var(--status-online); border: 1.5px solid var(--sea-200); }
.bb-row__check svg { width: 15px; height: 15px; }
.bb-morechip {
  display: inline-flex; align-items: center; gap: 6px; margin: 10px 18px 12px;
  font-size: var(--fs-xs); font-weight: 800; color: var(--text-muted);
  border: 1.5px dashed var(--ink-300); border-radius: var(--radius-pill); padding: 5px 12px; width: fit-content;
}
.bb-empty { padding: 18px; font-size: var(--fs-sm); color: var(--text-muted); }

/* ---- Charted Next details toggle + inline expandable panel ---- */
.bb-row__details {
  flex: none; font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700;
  letter-spacing: 0.03em; text-transform: uppercase; color: var(--ocean-600);
  background: none; border: none; cursor: pointer; padding: 4px 2px;
}
.bb-row__details:hover { text-decoration: underline; }
.bb-row__details:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.bb-detail {
  padding: 2px 18px 14px 56px; border-top: none; background: var(--paper-100);
}
.bb-detail__body {
  margin: 0 0 8px; font-size: var(--fs-xs); color: var(--text-strong); line-height: 1.5;
  overflow-wrap: break-word; white-space: pre-wrap;
}
.bb-detail__links { display: flex; flex-direction: column; gap: 4px; }
.bb-detail__link {
  font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--ocean-600);
  overflow-wrap: break-word; width: fit-content;
}
.bb-detail__link:hover { text-decoration: underline; }

/* ---- Charted Next dispatch picker ---- */
/* margin:0 kills the UA default checkbox margin so picker rows and spacer rows
   share one text left edge */
.bb-pick { accent-color: var(--rust-500); width: 16px; height: 16px; flex: none; cursor: pointer; margin: 0; }
.bb-pick-spacer { width: 16px; flex: none; }
.bb-dispatch {
  display: flex; align-items: center; gap: 12px; padding: 12px 18px;
  border-top: 1.5px solid var(--border-default); background: var(--paper-100);
}
.bb-dispatch__count { flex: 1 1 auto; font-size: var(--fs-xs); font-weight: 800; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.07em; }

/* ---- Projects drilldown: one collapsible card per project ---- */
.bb-projects { display: flex; flex-direction: column; gap: 10px; }
.bb-proj { padding: 0; }
.bb-proj__head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 18px;
  cursor: pointer; list-style: none;
}
.bb-proj__head::-webkit-details-marker { display: none; }
.bb-proj__head::before {
  content: "\25B8"; font-size: var(--fs-xs); color: var(--text-muted); width: 12px; flex: none;
}
.bb-proj[open] > .bb-proj__head::before { content: "\25BE"; }
.bb-proj__head:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.bb-proj__name { font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 700; color: var(--text-strong);
  margin-right: auto; overflow-wrap: anywhere; }
.bb-proj__body { border-top: 1px solid var(--border-soft); }
.bb-proj__label {
  padding: 10px 18px 2px; font-family: var(--font-mono); font-size: var(--fs-2xs);
  letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted);
}
.bb-row__rank { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-faint); width: 22px; flex: none; text-align: right; }
.bb-proj-quiet { font-size: var(--fs-xs); color: var(--text-muted); line-height: 1.5; overflow-wrap: break-word; }
.bb-proj-dispatch { border: 1.5px solid var(--border-default); border-radius: var(--radius-md); }

.bb-foot { display: flex; justify-content: flex-end; border-top: 1px solid var(--border-default); padding-top: 14px; }

@media (max-width: 900px) {
  .bb-cols { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="bb-nav">
  <div class="bb-nav__inner">
    <span class="bb-brand">
      <span class="bb-brand__disc">

          <path d="M12 6v16"/><path d="m19 13 2-1a9 9 0 0 1-18 0l2 1"/><path d="M9 11h6"/><circle cx="12" cy="4" r="2"/>

  <section class="bb-section">

  <!-- Shown only when the payload carries the per-project drilldown

  <div class="bb-cols">

  <footer class="bb-foot">

<!-- ONE SLOT. bin/fm-bearings-board.sh build injects the fresh
     fm-bearings-board.v1 payload in place of the placeholder below; everything

<script id="bearings-data" type="application/json">
__FM_BEARINGS_BOARD_DATA__

<!-- Shared decision-card builder, injected verbatim; see
     .agents/skills/bearings/assets/decision-card.js. Defines
     window.FMDecisionCard before the board's own script below runs. -->
<script>
__FM_DECISION_CARD_JS__
</script>

<script>
(function () {
  "use strict";

  /* Fail closed: a board with unreadable or wrong-schema data says so plainly
     instead of rendering an empty page that looks like an empty fleet. */
  function renderBoardError(msg) {
    var main = document.querySelector(".bb-main");
    main.innerHTML = "";
    var card = document.createElement("div");
    card.className = "fm-card fm-card--poster bb-decision";
    var pad = document.createElement("div");
    pad.className = "bb-decision__pad";
    var h = document.createElement("h3");
    h.className = "bb-decision__title";
    h.textContent = "This board could not load";
    var d = document.createElement("p");
    d.className = "bb-decision__detail";
    d.textContent = msg + " - ask firstmate to rebuild the board.";
    pad.appendChild(h);
    pad.appendChild(d);
    card.appendChild(pad);
    main.appendChild(card);
  }

  var data;
  try {
    data = JSON.parse(document.getElementById("bearings-data").textContent);
  } catch (e) {
    renderBoardError("The board data is not valid JSON");
    return;
  }
  if (!data || data.schema !== "fm-bearings-board.v1") {
    renderBoardError("Unsupported board data schema: " + (data && data.schema ? data.schema : "(none)"));
    return;
  }
  var fleetLists = [data.captains_call, data.underway, data.landed, data.charted];
  var callItemsValid = Array.isArray(data.captains_call) && data.captains_call.every(function (item) {
    return item && typeof item === "object" &&
      typeof item.key === "string" && item.key.length > 0 &&
      typeof item.type === "string" && item.type.length > 0 &&
      typeof item.title === "string" && item.title.length > 0 &&
      Array.isArray(item.options);
  });
  if (!fleetLists.every(Array.isArray) || !callItemsValid) {
    renderBoardError("The board data does not have the required structure");
    return;
  }

  try {
  /* el/badge/ctxRow/utf8ByteLength/CHECK_SVG are the shared decision-card
     helpers injected above (.agents/skills/bearings/assets/decision-card.js);
     aliased locally so the rest of this script reads exactly as before. */
  var el = window.FMDecisionCard.el;
  var badge = window.FMDecisionCard.badge;
  var ctxRow = window.FMDecisionCard.ctxRow;
  var utf8ByteLength = window.FMDecisionCard.utf8ByteLength;
  /* Warnings ride the charted feed for layout only; they are alarms, not work,
     so every count of queued work excludes them. */
  function isWarning(t) { return t && t.kind === "warning"; }
  function chartedQueued(rows) { return (rows || []).filter(function (t) { return !isWarning(t); }); }
  /* Charted Next reads newest filed first, so the most recently filed upcoming
     work is at the top. ISO filed dates compare as text; a row with no
     comparable date keeps its payload order after every dated row. */
  function chartedOrder(rows) {
    var dated = [], undated = [];
    (rows || []).forEach(function (t) {
      if (t && typeof t.filed === "string" && t.filed) dated.push(t); else undated.push(t);
    });
    dated.sort(function (a, b) { return a.filed < b.filed ? 1 : (a.filed > b.filed ? -1 : 0); });
    return dated.concat(undated);
  }
  var chartedMoreQueued = data.charted_more || 0;
  var chartedMoreWarnings = data.charted_warning_more || 0;

  document.getElementById("bb-provenance").textContent = data.schema + " · " + data.generated;

  /* stat strip */
  var callTotal = data.captains_call.length;
  var stats = [
    { n: callTotal, l: "need you", call: true },
    { n: data.underway.length, l: "underway" },
    { n: data.landed.length, l: "landed recently" },
    { n: chartedQueued(data.charted).length + chartedMoreQueued, l: "charted next" }
  ];
  var projects = Array.isArray(data.projects) ? data.projects : null;
  if (projects) {
    stats.push({ n: projects.filter(function (p) {
      return (p.next || []).some(function (t) { return t.status === "startable"; });
    }).length, l: "projects ready" });
  }
  var strip = document.getElementById("bb-stats");
  stats.forEach(function (s) {
    var t = el("div", "bb-stat" + (s.call ? " bb-stat--call" : ""));
    t.appendChild(el("span", "bb-stat__num", String(s.n)));
    t.appendChild(el("span", "bb-stat__label", s.l));
    strip.appendChild(t);
  });
  document.getElementById("bb-call-sub").textContent =
    callTotal ? callTotal + " item" + (callTotal === 1 ? "" : "s") + " wait on you, captain" : "nothing needs you, captain";

  /* Captain's Call deck: every item renders as the same full card, built by
     the shared FMDecisionCard.build (decision-card.js) so this card is
     exactly the one a one-off captain question page also renders. Only what
     genuinely varies by item type - top badges, context rows, a merge's PR
     link, the button color - is computed here. */
  var deck = document.getElementById("bb-call");

  data.captains_call.forEach(function (item) {
    var isMerge = item.type === "merge";
    var normalized = {
      key: item.key,
      title: item.title,
      detail: isMerge ? item.detail : undefined,
      options: item.options.map(function (o) {
        return {
          value: o.value, label: o.label, hint: o.hint,
          recommended: !!(item.recommend_value && o.value === item.recommend_value)
        };
      }),
      allowFreeform: item.allow_freeform,
      freeformHint: item.freeform_hint,
      close: item.close
    };
    var buildOpts = {
      schema: "fm-bearings-answer.v1",
      promptLabel: "Captain's Call answer",
      buttonClass: isMerge ? "fm-btn--gold" : "fm-btn--primary",
      top: isMerge
        ? [badge("online", "checks green"), badge(item.risk === "low" ? "neutral" : "warn", "risk " + item.risk)]
        : [badge("solid", "decision"), el("span", "bb-decision__repo", item.repo)],
      link: (isMerge && item.pr_url) ? { text: item.pr_url, url: item.pr_url } : null,
      /* the rec marker on the option itself carries the recommendation */
      context: isMerge ? [] : [item.about ? ctxRow("about", item.about) : null, item.decide ? ctxRow("decide", item.decide) : null].filter(Boolean),
      alwaysShowContext: !isMerge,
      onQueued: function () {
        /* deal the next card once this one is answered */
        setTimeout(function () { showCard(active < cards.length - 1 ? active + 1 : active); }, 450);
      }
    };
    var card = window.FMDecisionCard.build(normalized, buildOpts);
    deck.appendChild(card);
  });

  /* stack navigation: one card at a time, dealt off the pile */
  var cards = Array.prototype.slice.call(deck.children);
  var active = 0;
  var stackCount = document.getElementById("bb-stack-count");
  var stackPrev = document.getElementById("bb-stack-prev");
  var stackNext = document.getElementById("bb-stack-next");
  var stackNav = stackCount.parentNode;
  function showCard(i) {
    active = Math.max(0, Math.min(cards.length - 1, i));
    cards.forEach(function (c, j) { c.hidden = j !== active; });
    var answered = deck.querySelectorAll(".is-queued").length;
    stackCount.textContent = "card " + (active + 1) + " of " + cards.length +
      (answered ? " · " + answered + " answered" : "");
    stackPrev.disabled = active === 0;
    stackNext.disabled = active === cards.length - 1;
    /* the pile thins as the deal approaches the bottom */
    deck.classList.toggle("bb-call--penult", active === cards.length - 2);
    deck.classList.toggle("bb-call--last", active === cards.length - 1);
  }
  if (cards.length) {
    stackPrev.addEventListener("click", function () { showCard(active - 1); });
    stackNext.addEventListener("click", function () { showCard(active + 1); });
    showCard(0);
  } else {
    deck.classList.add("bb-call--empty");
    deck.appendChild(el("div", "bb-empty", "Nothing needs your action right now."));
    stackNav.hidden = true;
  }

  /* Underway */
  var uw = document.getElementById("bb-underway");
  if (!data.underway.length) uw.appendChild(el("div", "bb-empty", "Nothing is underway."));
  data.underway.forEach(function (t) {
    var row = el("div", "bb-row");
    row.appendChild(badge(t.state === "working" ? "online" : "info", t.state));
    var main = el("div", "bb-row__main");
    /* the snapshot's durable name-or-id label leads the row so a scan says
       WHICH task this is; the run status keeps its place on the second line */
    main.appendChild(el("div", "bb-row__title", t.name));
    /* captain-facing rows name the repo; the internal task id shows only when
       no repo is known */
    main.appendChild(el("div", "bb-row__sub",
      t.doing + " · " + t.kind + " · " + (t.repo || t.id)));
    row.appendChild(main);
    uw.appendChild(row);
  });

  /* Landed */
  var ld = document.getElementById("bb-landed");
  if (!data.landed.length) ld.appendChild(el("div", "bb-empty", "No recent completions are in the current baseline."));
  data.landed.forEach(function (t) {
    var row = el("div", "bb-row");
    var chk = el("span", "bb-row__check");
    chk.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    row.appendChild(chk);
    var main = el("div", "bb-row__main");
    main.appendChild(el("div", "bb-row__title", t.what));
    main.appendChild(el("div", "bb-row__sub", (t.repo || t.id) + " · " + t.owner));
    row.appendChild(main);
    if (t.pr_url) {
      var a = el("a", "bb-row__pr", "#" + t.pr_url.split("/").pop());
      a.href = t.pr_url; a.title = t.pr_url; a.target = "_blank"; a.rel = "noopener";
      row.appendChild(a);
    }
    ld.appendChild(row);
  });

  /* Charted Next + dispatch picker. The Projects drilldown shares this one
     dispatch.charted selection: picks are deduplicated by id across both
     sections, a pick of an id checks it everywhere it appears, and either
     section's button queues the whole selection. */
  var ch = document.getElementById("bb-charted");
  var projWrap = document.getElementById("bb-projects");
  var pickContainers = [ch, projWrap];
  var bars = [
    { wrap: document.getElementById("bb-dispatch"), count: document.getElementById("bb-dispatch-count"),
      btn: document.getElementById("bb-dispatch-btn"), any: false },
    { wrap: document.getElementById("bb-proj-dispatch"), count: document.getElementById("bb-proj-dispatch-count"),
      btn: document.getElementById("bb-proj-dispatch-btn"), any: false }
  ];

  function pickedIds() {
    var ids = [];
    pickContainers.forEach(function (c) {
      Array.prototype.forEach.call(c.querySelectorAll(".bb-pick:checked"), function (p) {
        if (ids.indexOf(p.value) === -1) ids.push(p.value);
      });
    });
    return ids;
  }
  function setPicked(id, checked) {
    pickContainers.forEach(function (c) {
      Array.prototype.forEach.call(c.querySelectorAll(".bb-pick"), function (p) {
        if (p.value === id) p.checked = checked;
      });
    });
  }
  function refreshBar(limitMessage) {
    var n = pickedIds().length;
    bars.forEach(function (b) {
      b.count.textContent = limitMessage || (n ? n + " picked for dispatch" : "pick queued work to dispatch");
      b.btn.disabled = !n;
    });
  }
  function makePick(id, bar) {
    bar.any = true;
    var pick = document.createElement("input");
    pick.type = "checkbox"; pick.className = "bb-pick"; pick.value = id;
    pick.setAttribute("aria-label", "Pick " + id + " for dispatch");
    pick.addEventListener("change", function () {
      setPicked(id, pick.checked);
      if (pick.checked && utf8ByteLength(pickedIds().join(",")) > 512) {
        setPicked(id, false);
        refreshBar("Selection limit reached (512 bytes maximum). ");
        return;
      }
      refreshBar();
    });
    return pick;
  }
  /* The detail panel is an anchored sibling in this same page - never a
     separate Lavish session - and renders only when the row actually carries
     one, so a row with no detail looks exactly as it did before. Adds the
     toggle to <row> and returns the panel for the caller to place after it. */
  function detailPanel(t, row) {
    var hasDetail = t.detail && typeof t.detail === "object" &&
      (t.detail.body || (Array.isArray(t.detail.links) && t.detail.links.length));
    if (!hasDetail) return null;
    var panel = el("div", "bb-detail");
    panel.hidden = true;
    if (t.detail.body) panel.appendChild(el("p", "bb-detail__body", t.detail.body));
    if (Array.isArray(t.detail.links) && t.detail.links.length) {
      var linkWrap = el("div", "bb-detail__links");
      t.detail.links.forEach(function (lk) {
        var a = el("a", "bb-detail__link", lk.label);
        a.href = lk.url; a.target = "_blank"; a.rel = "noopener";
        linkWrap.appendChild(a);
      });
      panel.appendChild(linkWrap);
    }
    var toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "bb-row__details";
    toggle.textContent = "details";
    toggle.setAttribute("aria-expanded", "false");
    toggle.addEventListener("click", function () {
      panel.hidden = !panel.hidden;
      toggle.setAttribute("aria-expanded", panel.hidden ? "false" : "true");
      toggle.textContent = panel.hidden ? "details" : "hide";
    });
    row.appendChild(toggle);
    return panel;
  }

  if (!chartedQueued(data.charted).length && !chartedMoreQueued) {
    ch.appendChild(el("div", "bb-empty", "Nothing is queued."));
  }
  chartedOrder(data.charted).forEach(function (t) {
    var row = el("div", "bb-row");
    if (t.dispatchable && !isWarning(t)) {
      row.appendChild(makePick(t.id, bars[0]));
    } else {
      row.appendChild(el("span", "bb-pick-spacer"));
    }
    var main = el("div", "bb-row__main");
    main.appendChild(el("div", "bb-row__title", t.title));
    /* second line keeps the title uncrowded in the half-width column */
    var chSub = t.repo || t.id;
    main.appendChild(el("div", "bb-row__sub", t.reason ? t.reason + " · " + chSub : chSub));
    row.appendChild(main);
    if (isWarning(t)) row.appendChild(badge("danger", "needs repair"));
    else if (t.reason) row.appendChild(badge("warn", "waiting"));
    var panel = detailPanel(t, row);
    ch.appendChild(row);
    if (panel) ch.appendChild(panel);
  });
  var chartedShown = chartedQueued(data.charted).length;
  var chartedTotal = chartedShown + chartedMoreQueued;
  document.getElementById("bb-charted-sub").textContent =
    chartedMoreQueued ? "showing " + chartedShown + " of " + chartedTotal : "";
  if (chartedMoreQueued) {
    ch.appendChild(el("span", "bb-morechip", "+" + chartedMoreQueued + " more queued - ask firstmate for the full chart"));
  }
  if (chartedMoreWarnings) {
    ch.appendChild(el("span", "bb-morechip", "+" + chartedMoreWarnings + " more repair warning" + (chartedMoreWarnings === 1 ? "" : "s") + " - ask firstmate for the full chart"));
  }

  /* Projects drilldown: one collapsible card per project with charted work,
     in payload order; ranked next actions render in payload order too, since
     the snapshot already ranked them. Projects with nothing charted share one
     compact line so the captain still sees the whole fleet. */
  document.getElementById("bb-projects-section").hidden = !projects;
  if (projects) {
    var STATUS_BADGE = { startable: ["online", "ready"], blocked: ["warn", "blocked"],
      dated: ["warn", "dated"], held: ["warn", "held"] };
    var quiet = [];
    var shownProjects = 0;
    projects.forEach(function (p) {
      if (!p.decisions.length && !p.underway.length && !p.next.length) { quiet.push(p.name); return; }
      shownProjects++;
      var ready = p.next.filter(function (t) { return t.status === "startable"; }).length;
      var waiting = p.next.length - ready;
      var card = el("details", "fm-card bb-proj");
      card.open = p.decisions.length > 0 || ready > 0;
      var head = el("summary", "bb-proj__head");
      head.appendChild(el("span", "bb-proj__name", p.name));
      if (!p.registered) head.appendChild(badge("neutral", "unregistered"));
      if (p.decisions.length) head.appendChild(badge("danger", p.decisions.length + " need" + (p.decisions.length === 1 ? "s" : "") + " you"));
      if (ready) head.appendChild(badge("online", ready + " ready"));
      if (p.underway.length) head.appendChild(badge("info", p.underway.length + " underway"));
      if (waiting) head.appendChild(badge("warn", waiting + " waiting"));
      card.appendChild(head);
      var body = el("div", "bb-proj__body");
      function group(label, fill) {
        body.appendChild(el("div", "bb-proj__label", label));
        var rows = el("div", "bb-rows");
        fill(rows);
        body.appendChild(rows);
      }
      if (p.decisions.length) group("Needs you", function (rows) {
        p.decisions.forEach(function (d) {
          var row = el("div", "bb-row");
          row.appendChild(badge("solid", "decision"));
          var main = el("div", "bb-row__main");
          main.appendChild(el("div", "bb-row__title", d.title));
          main.appendChild(el("div", "bb-row__sub", "answer it on its Captain's Call card"));
          row.appendChild(main);
          rows.appendChild(row);
        });
      });
      if (p.underway.length) group("Underway", function (rows) {
        p.underway.forEach(function (u) {
          var row = el("div", "bb-row");
          row.appendChild(badge(u.state === "working" ? "online" : "info", u.state));
          var main = el("div", "bb-row__main");
          main.appendChild(el("div", "bb-row__title", u.name));
          row.appendChild(main);
          rows.appendChild(row);
        });
      });
      if (p.next.length) group("Next up", function (rows) {
        p.next.forEach(function (t, i) {
          var row = el("div", "bb-row");
          row.appendChild(el("span", "bb-row__rank", String(i + 1)));
          row.appendChild(t.dispatchable ? makePick(t.id, bars[1]) : el("span", "bb-pick-spacer"));
          var main = el("div", "bb-row__main");
          main.appendChild(el("div", "bb-row__title", t.title));
          main.appendChild(el("div", "bb-row__sub", t.reason || "ready to start"));
          row.appendChild(main);
          var tone = STATUS_BADGE[t.status] || ["warn", t.status];
          row.appendChild(badge(tone[0], tone[1]));
          var panel = detailPanel(t, row);
          rows.appendChild(row);
          if (panel) rows.appendChild(panel);
        });
        if (p.more) rows.appendChild(el("span", "bb-morechip", "+" + p.more + " more ranked - ask firstmate for the full list"));
      });
      card.appendChild(body);
      projWrap.appendChild(card);
    });
    if (quiet.length) projWrap.appendChild(el("div", "bb-proj-quiet", "Nothing charted: " + quiet.join(", ")));
    if (!projects.length) projWrap.appendChild(el("div", "bb-empty", "No projects are registered or charted."));
    document.getElementById("bb-projects-sub").textContent =
      shownProjects + " with charted work" + (quiet.length ? " · " + quiet.length + " quiet" : "");
  }

  bars.forEach(function (b) {
    b.wrap.hidden = !b.any;
    if (!b.any) return;
    b.btn.addEventListener("click", function () {
      var ids = pickedIds();
      var dispatchAnswer = ids.join(",");
      if (!ids.length) return;
      if (utf8ByteLength(dispatchAnswer) > 512) {
        refreshBar("Selection is too long to queue (512 bytes maximum). ");
        return;
      }
      if (window.lavish && window.lavish.queuePrompt) {
        window.lavish.queuePrompt(
          "Dispatch order - start this queued work now: " + ids.join(", "),
          { tag: "choice", text: "Dispatch: " + ids.join(", "), element: b.wrap,
            queueKey: "dispatch.charted",
            data: { question: "dispatch.charted", answer: dispatchAnswer } }
        );
      }
      bars.forEach(function (o) { o.wrap.classList.add("is-queued"); });
    });
  });
  refreshBar();
  } catch (e) {
    renderBoardError("The board data could not be rendered");
  }
})();
</script>
</body>
</html>
